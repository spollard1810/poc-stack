# The AWX instance (awx/awx.yaml). The operator above turns it into deployments.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: awx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: awx
  source:
    repoURL: ${PLATFORM_REPO_URL}
    targetRevision: main
    path: awx
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # The AWX resource type comes from the operator app; retry until it exists
    syncOptions: [SkipDryRunOnMissingResource=true]
    retry: { limit: 10, backoff: { duration: 30s, factor: 2, maxDuration: 5m } }
