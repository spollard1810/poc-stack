# NetBox: the community Helm chart, with values from this repo (netbox/values.yaml).
# Upgrade by changing targetRevision below; change settings in netbox/values.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netbox
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: netbox
  sources:
    - repoURL: https://charts.netbox.oss.netboxlabs.com/
      chart: netbox
      targetRevision: "${NETBOX_CHART_VERSION}"
      helm:
        releaseName: netbox
        valueFiles:
          - $values/netbox/values.yaml
    - repoURL: ${PLATFORM_REPO_URL}
      targetRevision: main
      ref: values
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: { limit: 5, backoff: { duration: 20s, factor: 2, maxDuration: 5m } }
