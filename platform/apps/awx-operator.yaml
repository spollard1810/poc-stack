# AWX operator (kustomize, see awx-operator/kustomization.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: awx-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: awx
  source:
    repoURL: ${PLATFORM_REPO_URL}
    targetRevision: main
    path: awx-operator
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: { limit: 5, backoff: { duration: 20s, factor: 2, maxDuration: 5m } }
