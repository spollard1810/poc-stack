# The root "app of apps": Argo CD deploys every Application in apps/.
# bootstrap.sh applies this once. After that, change the platform by
# committing to this repo - Argo CD syncs it and reverts manual changes.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    repoURL: ${PLATFORM_REPO_URL}
    targetRevision: main
    path: apps
  syncPolicy:
    automated: { prune: true, selfHeal: true }
