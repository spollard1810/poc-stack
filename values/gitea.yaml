# Gitea (chart gitea-charts/gitea) - rendered by bootstrap.sh into .generated/
gitea:
  admin:
    username: "${POC_ADMIN_USER}"
    password: "${POC_ADMIN_PASSWORD}"
    email: "${POC_ADMIN_EMAIL}"
    passwordMode: keepUpdated

  config:
    server:
      DOMAIN: "${NODE_IP}"
      ROOT_URL: http://${NODE_IP}:${GITEA_PORT}/
      LANDING_PAGE: login            # home page goes straight to sign-in
      SSH_DOMAIN: "${NODE_IP}"
      SSH_PORT: ${GITEA_SSH_PORT}
    database:
      DB_TYPE: postgres
      HOST: ${PG_HOST}:5432
      NAME: gitea
      USER: gitea
      PASSWD: "${GITEA_DB_PASSWORD}"
      SSL_MODE: disable
    cache:
      ADAPTER: redis
      HOST: redis://:${VALKEY_PASSWORD}@${VALKEY_HOST}:6379/2
    session:
      PROVIDER: redis
      PROVIDER_CONFIG: redis://:${VALKEY_PASSWORD}@${VALKEY_HOST}:6379/3
    queue:
      TYPE: redis
      CONN_STR: redis://:${VALKEY_PASSWORD}@${VALKEY_HOST}:6379/4
    service:
      DISABLE_REGISTRATION: true
      REQUIRE_SIGNIN_VIEW: true      # nothing (repos, users, API) visible without login
    service.explore:
      REQUIRE_SIGNIN_VIEW: true
    repository:
      DEFAULT_BRANCH: main
    packages:
      ENABLED: true          # built-in container/package registry (for custom EEs)
    webhook:
      ALLOWED_HOST_LIST: "*"  # allow webhooks to AWX inside the cluster

persistence:
  enabled: true
  storageClass: "${STORAGE_CLASS}"
  size: "${GITEA_SIZE}"

# Exposed on NODE_IP:GITEA_PORT / GITEA_SSH_PORT (no ingress / DNS)
service:
  http:
    type: NodePort
    nodePort: ${GITEA_PORT}
  ssh:
    type: NodePort
    nodePort: ${GITEA_SSH_PORT}

ingress:
  enabled: false

# Use the shared PostgreSQL / Valkey instead of bundled sub-charts
postgresql:
  enabled: false
postgresql-ha:
  enabled: false
valkey:
  enabled: false
valkey-cluster:
  enabled: false

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { memory: 1Gi }

test:
  enabled: false
