# Shared Valkey (Redis-compatible). DB index allocation:
#   0 = NetBox tasks   1 = NetBox cache
#   2 = Gitea cache    3 = Gitea sessions   4 = Gitea queues
# (AWX runs its own Redis sidecar managed by the operator.)
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: data
spec:
  selector: { app: valkey }
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  namespace: data
spec:
  serviceName: valkey
  replicas: 1
  selector:
    matchLabels: { app: valkey }
  template:
    metadata:
      labels: { app: valkey }
    spec:
      containers:
        - name: valkey
          image: ${VALKEY_IMAGE}
          args: ["--requirepass", "$(VALKEY_PASSWORD)", "--appendonly", "yes", "--dir", "/data"]
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef: { name: valkey, key: password }
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["sh", "-c", "valkey-cli -a \"$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ${STORAGE_CLASS}
        resources:
          requests:
            storage: ${VALKEY_SIZE}
