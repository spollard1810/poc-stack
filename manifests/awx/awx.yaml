# AWX instance, using the shared PostgreSQL (unmanaged).
# Jobs run as short-lived pods in the "awx" namespace (= the Ansible workers);
# the seed step adds an "ansible-workers" container group with its own pod spec.
apiVersion: awx.ansible.com/v1beta1
kind: AWX
metadata:
  name: awx
  namespace: awx
spec:
  admin_user: ${POC_ADMIN_USER}
  admin_email: ${POC_ADMIN_EMAIL}
  admin_password_secret: awx-admin-password
  secret_key_secret: awx-secret-key
  postgres_configuration_secret: awx-postgres-configuration

  # Exposed on NODE_IP:AWX_PORT (no ingress / DNS)
  service_type: NodePort
  nodeport_port: ${AWX_PORT}
  ingress_type: none

  web_replicas: 1
  task_replicas: 1
  web_resource_requirements:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 2Gi }
  task_resource_requirements:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 2Gi }
  ee_resource_requirements:
    requests: { cpu: 100m, memory: 256Mi }
  redis_resource_requirements:
    requests: { cpu: 50m, memory: 64Mi }

  extra_settings:
    - setting: CSRF_TRUSTED_ORIGINS
      value:
        - http://${NODE_IP}:${AWX_PORT}
