---
# Declarative load: data/netbox_devices.yml (in Git) -> NetBox.
# Creates/updates sites, roles, platforms, devices, a mgmt interface + IP per
# device, and sets that IP as the device's primary IPv4. Never deletes anything.
#
# AWX : job template "NetBox - Load devices" (inventory "Local", credential "NetBox")
# CLI : NETBOX_API=http://<node-ip>:30080 NETBOX_TOKEN=nbt_... ansible-playbook netbox_load_devices.yml
- name: Load devices into NetBox from data/netbox_devices.yml
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - data/netbox_devices.yml
  vars:
    nb_url: "{{ lookup('ansible.builtin.env', 'NETBOX_API') }}"
    nb_token: "{{ lookup('ansible.builtin.env', 'NETBOX_TOKEN') }}"
    # NetBox 4.5+ tokens (nbt_...) use "Bearer", older ones "Token"
    nb_auth_header: "{{ ('Bearer ' if nb_token.startswith('nbt_') else 'Token ') ~ nb_token }}"
  module_defaults:
    group/netbox.netbox.netbox:
      netbox_url: "{{ nb_url }}"
      netbox_token: "{{ nb_token }}"
      validate_certs: false

  tasks:
    - name: Prepare
      ansible.builtin.include_tasks: tasks/ensure_pynetbox.yml

    - name: Sites
      netbox.netbox.netbox_site:
        data:
          name: "{{ item.name }}"
          slug: "{{ item.slug }}"
          status: "{{ item.status | default('active') }}"
          description: "{{ item.description | default(omit) }}"
        state: present
      loop: "{{ sites }}"
      loop_control: { label: "{{ item.name }}" }

    - name: Device roles
      netbox.netbox.netbox_device_role:
        data: "{{ item }}"
        state: present
      loop: "{{ device_roles }}"
      loop_control: { label: "{{ item.name }}" }

    - name: Platforms
      netbox.netbox.netbox_platform:
        data:
          name: "{{ item.name }}"
          slug: "{{ item.slug }}"
          manufacturer: "{{ item.manufacturer | default(omit) }}"
        state: present
      loop: "{{ platforms }}"
      loop_control: { label: "{{ item.name }}" }

    # The netbox modules look device types up by slug only. Library slugs are
    # vendor-prefixed (cisco-c8300-1n1s-6t), so resolve them from the model name.
    - name: Look up device types by model name
      ansible.builtin.uri:
        url: "{{ nb_url }}/api/dcim/device-types/?model={{ item | urlencode }}"
        headers:
          Authorization: "{{ nb_auth_header }}"
        validate_certs: false
      loop: "{{ devices | map(attribute='device_type') | unique }}"
      register: _device_types

    - name: Every device type must already exist in NetBox
      ansible.builtin.assert:
        that: item.json.count == 1
        fail_msg: >-
          Device type '{{ item.item }}' not found in NetBox (matches: {{ item.json.count }}).
          Use the model name exactly as shown under Devices > Device Types, or import it
          from the community device-type library first.
        quiet: true
      loop: "{{ _device_types.results }}"
      loop_control: { label: "{{ item.item }}" }

    - name: Map model name to slug
      ansible.builtin.set_fact:
        device_type_slug: "{{ device_type_slug | default({}) | combine({item.item: item.json.results[0].slug}) }}"
      loop: "{{ _device_types.results }}"
      loop_control: { label: "{{ item.item }}" }

    - name: Devices
      netbox.netbox.netbox_device:
        data:
          name: "{{ item.name }}"
          site: "{{ item.site }}"
          device_role: "{{ item.role }}"   # module name for NetBox's "role"
          device_type: "{{ device_type_slug[item.device_type] }}"
          platform: "{{ item.platform | default(omit) }}"
          serial: "{{ item.serial | default(omit, true) }}"
          status: "{{ item.status | default('active') }}"
        state: present
      loop: "{{ devices }}"
      loop_control: { label: "{{ item.name }}" }

    - name: Management interfaces
      netbox.netbox.netbox_device_interface:
        data:
          device: "{{ item.name }}"
          name: "{{ item.mgmt_interface }}"
          type: "{{ item.mgmt_interface_type | default('1000base-t') }}"
          mgmt_only: true
        state: present
      loop: "{{ devices | selectattr('mgmt_interface', 'defined') }}"
      loop_control: { label: "{{ item.name }} {{ item.mgmt_interface }}" }

    - name: Management IP addresses
      netbox.netbox.netbox_ip_address:
        data:
          address: "{{ item.mgmt_ip }}"
          status: active
          assigned_object:
            device: "{{ item.name }}"
            name: "{{ item.mgmt_interface }}"
        state: present
      loop: "{{ devices | selectattr('mgmt_ip', 'defined') }}"
      loop_control: { label: "{{ item.name }} {{ item.mgmt_ip }}" }

    - name: Primary IPv4 (becomes ansible_host in the AWX NetBox inventory)
      netbox.netbox.netbox_device:
        data:
          name: "{{ item.name }}"
          primary_ip4: "{{ item.mgmt_ip }}"
        state: present
      loop: "{{ devices | selectattr('mgmt_ip', 'defined') }}"
      loop_control: { label: "{{ item.name }} -> {{ item.mgmt_ip }}" }
