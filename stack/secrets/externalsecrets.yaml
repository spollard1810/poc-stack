---
# ---------------- NetBox ----------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: netbox-superuser-secret, namespace: netbox }
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: ClusterSecretStore, name: poc-store }
  target: { name: netbox-superuser-secret }
  data:
    - { secretKey: username, remoteRef: { key: poc-secrets, property: admin_user } }
    - { secretKey: password, remoteRef: { key: poc-secrets, property: admin_password } }
    - { secretKey: email, remoteRef: { key: poc-secrets, property: admin_email } }
    - { secretKey: api_token, remoteRef: { key: poc-secrets, property: netbox_superuser_token } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: netbox-app-secret, namespace: netbox }
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: ClusterSecretStore, name: poc-store }
  target:
    name: netbox-app-secret
    template:
      engineVersion: v2
      data:
        secret_key: "{{ .secret_key }}"
        api_token_peppers: '{"1": "{{ .pepper }}"}'
        email_password: ""
        ldap_bind_password: ""
  data:
    - { secretKey: secret_key, remoteRef: { key: poc-secrets, property: netbox_secret_key } }
    - { secretKey: pepper, remoteRef: { key: poc-secrets, property: netbox_pepper } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: netbox-db-secret, namespace: netbox }
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: ClusterSecretStore, name: poc-store }
  target: { name: netbox-db-secret }
  data:
    - { secretKey: password, remoteRef: { key: poc-secrets, property: netbox_db_password } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: netbox-valkey-secret, namespace: netbox }
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: ClusterSecretStore, name: poc-store }
  target: { name: netbox-valkey-secret }
  data:
    - { secretKey: password, remoteRef: { key: poc-secrets, property: valkey_password } }
---
# ---------------- AWX ----------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: awx-admin-password, namespace: awx }
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: ClusterSecretStore, name: poc-store }
  target: { name: awx-admin-password }
  data:
    - { secretKey: password, remoteRef: { key: poc-secrets, property: admin_password } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: awx-secret-key, namespace: awx }
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: ClusterSecretStore, name: poc-store }
  target: { name: awx-secret-key }
  data:
    - { secretKey: secret_key, remoteRef: { key: poc-secrets, property: awx_secret_key } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: awx-postgres-configuration, namespace: awx }
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: ClusterSecretStore, name: poc-store }
  target:
    name: awx-postgres-configuration
    template:
      engineVersion: v2
      data:
        host: ${PG_HOST}
        port: "5432"
        database: awx
        username: awx
        password: "{{ .password }}"
        sslmode: prefer
        type: unmanaged
  data:
    - { secretKey: password, remoteRef: { key: poc-secrets, property: awx_db_password } }
---
# ---------------- config job (AWX / NetBox / Gitea settings) ----------------
# Gets every key of the store as an environment variable.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: config-env, namespace: poc-config }
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: ClusterSecretStore, name: poc-store }
  target: { name: config-env }
  dataFrom:
    - extract: { key: poc-secrets }
