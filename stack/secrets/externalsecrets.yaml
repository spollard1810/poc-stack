# Which secret each app gets, and from which keys of the store (poc-secrets).
# Values never live in Git - only these mappings do.
#
# ---------------- foundation ----------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: gitea-admin, namespace: gitea }
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: ClusterSecretStore, name: poc-store }
  target: { name: gitea-admin, creationPolicy: Merge }
  data:
    - { secretKey: username, remoteRef: { key: poc-secrets, property: admin_user } }
    - { secretKey: password, remoteRef: { key: poc-secrets, property: admin_password } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: argocd-secret, namespace: argocd }
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: ClusterSecretStore, name: poc-store }
  target:
    name: argocd-secret
    creationPolicy: Merge
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        labels: { app.kubernetes.io/part-of: argocd, app.kubernetes.io/name: argocd-secret }
      data:
        server.secretkey: "{{ .server_secretkey }}"
        accounts.${POC_ADMIN_USER}.password: "{{ .admin_hash }}"
  data:
    - { secretKey: server_secretkey, remoteRef: { key: poc-secrets, property: argocd_server_secretkey } }
    - { secretKey: admin_hash, remoteRef: { key: poc-secrets, property: argocd_admin_hash } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: repo-stack, namespace: argocd }
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: ClusterSecretStore, name: poc-store }
  target:
    name: repo-stack
    creationPolicy: Merge
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        labels: { argocd.argoproj.io/secret-type: repository }
      data:
        type: git
        url: ${STACK_REPO_URL}
        username: argocd
        password: "{{ .token }}"
  data:
    - { secretKey: token, remoteRef: { key: poc-secrets, property: gitea_argocd_token } }
---
