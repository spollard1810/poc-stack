# Where secret VALUES come from. Today: the Kubernetes secret secret-store/poc-secrets
# (written by bootstrap.sh). To move to Delinea, replace the provider below with the
# secretserver provider - every ExternalSecret in this folder keeps working unchanged.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: store-reader
  namespace: secret-store
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: store-reader
  namespace: secret-store
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: store-reader
  namespace: secret-store
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: store-reader }
subjects:
  - { kind: ServiceAccount, name: store-reader, namespace: secret-store }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: store-reader-review
rules:
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: store-reader-review
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: store-reader-review }
subjects:
  - { kind: ServiceAccount, name: store-reader, namespace: secret-store }
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: poc-store
spec:
  provider:
    kubernetes:
      remoteNamespace: secret-store
      server:
        caProvider: { type: ConfigMap, name: kube-root-ca.crt, key: ca.crt, namespace: secret-store }
      auth:
        serviceAccount: { name: store-reader, namespace: secret-store }
