# NetBox (chart netbox-community/netbox), deployed by Argo CD (apps/netbox.yaml).
# No secrets in this file: passwords and keys live in Kubernetes secrets that
# bootstrap.sh creates (later: External Secrets from Delinea) and are referenced by name.
superuser:
  existingSecret: netbox-superuser-secret     # keys: username, password, email, api_token
existingSecret: netbox-app-secret             # keys: secret_key, api_token_peppers, email_password, ldap_bind_password

allowedHosts: ["*"]
loginRequired: true             # no pages or API data without login
timeZone: UTC

# The chart's "medium" preset caps NetBox at 1.5Gi, which NetBox 4.7 exceeds under
# bursts of API calls (OOMKilled during discovery testing). Explicit sizing instead.
resourcesPreset: none
resources:
  requests: { cpu: 500m, memory: 1Gi }
  limits: { memory: 3Gi }

# Volumes are never pruned by Argo CD, even if this file stops rendering them.
persistence:
  enabled: true
  storageClass: "${STORAGE_CLASS}"
  size: "${NETBOX_MEDIA_SIZE}"
  annotations: { argocd.argoproj.io/sync-options: Prune=false }

# Custom scripts uploaded through the UI/API (e.g. "Add devices for discovery")
# are files - keep them across pod restarts. Shared by the web and worker pods.
scriptsPersistence:
  enabled: true
  storageClass: "${STORAGE_CLASS}"
  size: 1Gi
  annotations: { argocd.argoproj.io/sync-options: Prune=false }

# Exposed on NODE_IP:NETBOX_PORT (no ingress / DNS)
service:
  type: NodePort
  port: 80
  nodePort: "${NETBOX_PORT}"
ingress:
  enabled: false

# --- shared PostgreSQL (data namespace) ---------------------------------------
postgresql:
  enabled: false
externalDatabase:
  host: "${PG_HOST}"
  port: 5432
  database: netbox
  username: netbox
  existingSecretName: netbox-db-secret
  existingSecretKey: password
  options:
    sslmode: disable

# --- shared Valkey (data namespace) -------------------------------------------
valkey:
  enabled: false
tasksDatabase:
  host: "${VALKEY_HOST}"
  port: 6379
  database: 0
  existingSecretName: netbox-valkey-secret
  existingSecretKey: password
cachingDatabase:
  host: "${VALKEY_HOST}"
  port: 6379
  database: 1
  existingSecretName: netbox-valkey-secret
  existingSecretKey: password

worker:
  enabled: true
  resourcesPreset: none
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
