# Namespaces, the secret store, and which secret each app gets (secrets/).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: secret-store
  source:
    repoURL: ${STACK_REPO_URL}
    targetRevision: main
    path: secrets
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [SkipDryRunOnMissingResource=true]
    retry: { limit: 10, backoff: { duration: 20s, factor: 2, maxDuration: 5m } }
