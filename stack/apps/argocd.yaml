# Argo CD manages itself from argocd/values.yaml (prune off, so it can't delete itself).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: "${ARGOCD_CHART_VERSION}"
      helm:
        releaseName: argocd
        valueFiles: [ $values/argocd/values.yaml ]
    - repoURL: ${STACK_REPO_URL}
      targetRevision: main
      ref: values
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    retry: { limit: 10, backoff: { duration: 20s, factor: 2, maxDuration: 5m } }
