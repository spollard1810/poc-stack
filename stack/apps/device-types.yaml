# Device types from the NetBox community library (vendors in device-types/vendors.env).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: device-types
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: netbox
  source:
    repoURL: ${STACK_REPO_URL}
    targetRevision: main
    path: device-types
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: { limit: 10, backoff: { duration: 20s, factor: 2, maxDuration: 5m } }
