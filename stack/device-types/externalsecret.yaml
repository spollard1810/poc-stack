# The automation API token (issued by the configure job) for the importer.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: device-type-import }
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: ClusterSecretStore, name: poc-store }
  target: { name: device-type-import }
  data:
    - { secretKey: NETBOX_TOKEN, remoteRef: { key: poc-secrets, property: netbox_api_token } }
